---
version: 2

updates:
  # The Firebase SDK and everything it pulls in. Each update is prefixed again by
  # bin/prefix-dependencies.sh in the PR checks and the release.
  - package-ecosystem: "composer"
    assignees:
      - "JanaME"
    commit-message:
      prefix: "deps"
      include: "scope"
    directory: "/public"
    open-pull-requests-limit: 10
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Berlin"

  # Has to be "/" - that is what makes Dependabot read .github/workflows/.
  - package-ecosystem: "github-actions"
    assignees:
      - "JanaME"
    commit-message:
      prefix: "deps"
      include: "scope"
    directory: "/"
    open-pull-requests-limit: 10
    schedule:
      interval: "weekly"
      day: "monday"
      time: "07:00"
      timezone: "Europe/Berlin"
